        <h2>Ponete en contacto con nostros</h2>
        <p>Dejanos tu consulta y te respondemos a la brevedad.</p>
        <form action="">
            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre">
            </div>
            <div>
                <label for="email">Correo Electronico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@ejemplo.com">
            </div>
            <div>
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: +54 2665-323434" >
            </div>
            <div>
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" rows="5" placeholder="Escribinos tu consulta aquí."></textarea>
            </div>
            <button type="submit">Enviar consulta</button>
        </form>
        </div>
